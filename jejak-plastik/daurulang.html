<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Jejak Plastik VR | Pabrik Daur Ulang</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="js/common.js?v=5"></script>
  <script src="js/daurulang.js"></script>
</head>
<body>
  <div class="petunjuk">
    <strong>Laptop:</strong> seret layar untuk melihat sekeliling, klik tombol biru.<br>
    <strong>HP:</strong> gerakkan HP, tatap tombol biru 1,5 detik.
  </div>

  <a-scene jp-setup="umur: tiba di tempat daur ulang" loading-screen="dotsColor: #1F5FD1; backgroundColor: #E4F2EF">

    <a-sky color="#E3E9EB"></a-sky>

    <!-- Cahaya ruangan pabrik -->
    <a-entity light="type: ambient; color: #FFFFFF; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; color: #FFFFFF; intensity: 1" position="1 5 3"></a-entity>

    <a-entity id="kamera" camera look-controls wasd-controls="enabled: false" position="0 1.6 0"></a-entity>

    <!-- Ruangan pabrik -->
    <a-entity id="ruangan">
      <a-plane width="16" height="16" rotation="-90 0 0" color="#AEB6BA"></a-plane>
      <a-box width="16" height="5" depth="0.2" position="0 2.5 -6" color="#E2EAEC"></a-box>
      <a-box width="0.2" height="5" depth="16" position="-7 2.5 0" color="#D3DDE0"></a-box>
      <a-box width="0.2" height="5" depth="16" position="7 2.5 0" color="#D3DDE0"></a-box>
      <!-- Garis kuning keselamatan di lantai -->
      <a-plane width="7" height="0.08" rotation="-90 0 0" position="0 0.01 -2.2" color="#F2C230"></a-plane>
    </a-entity>

    <!-- Ban berjalan (conveyor) -->
    <a-entity id="conveyor" position="0 0 -2.8">
      <a-box width="6.6" height="0.1" depth="0.6" position="0 0.85 0" color="#2F3437"></a-box>
      <a-box width="6.6" height="0.08" depth="0.05" position="0 0.92 0.31" color="#9AA3A8"></a-box>
      <a-box width="6.6" height="0.08" depth="0.05" position="0 0.92 -0.31" color="#9AA3A8"></a-box>
      <a-box width="0.08" height="0.8" depth="0.5" position="-3.1 0.4 0" color="#5A6166"></a-box>
      <a-box width="0.08" height="0.8" depth="0.5" position="0 0.4 0" color="#5A6166"></a-box>
      <a-box width="0.08" height="0.8" depth="0.5" position="3.1 0.4 0" color="#5A6166"></a-box>
    </a-entity>

    <!-- Tahap 1: meja pilah dengan tiga wadah -->
    <a-entity id="pos-pilah" position="-2.4 0 -2.8">
      <a-box width="0.32" height="0.32" depth="0.32" position="-0.4 0.16 0.6" color="#CFEFFF"></a-box>
      <a-box width="0.32" height="0.32" depth="0.32" position="0 0.16 0.6" color="#1F5FD1"></a-box>
      <a-box width="0.32" height="0.32" depth="0.32" position="0.4 0.16 0.6" color="#2DB37A"></a-box>
      <a-text value="PILAH" align="center" color="#0E3B43" width="2.6" font="exo2bold" position="0 1.55 0"></a-text>
    </a-entity>

    <!-- Tahap 2: mesin cacah dan cuci -->
    <a-entity id="mesin-cacah" position="-0.8 0 -2.8">
      <a-box width="0.9" height="0.6" depth="0.9" position="0 1.2 0" color="#2E8C9A"></a-box>
      <a-cone radius-bottom="0.12" radius-top="0.35" height="0.3" position="0 1.65 0" color="#4FB0BD"></a-cone>
      <a-text value="CACAH DAN CUCI" align="center" color="#0E3B43" width="2.6" font="exo2bold" position="0 2.0 0"></a-text>
    </a-entity>

    <!-- Tahap 3: mesin pelelehan -->
    <a-entity id="mesin-leleh" position="0.8 0 -2.8">
      <a-box width="0.9" height="0.7" depth="0.9" position="0 1.25 0" color="#6F7C87"></a-box>
      <a-plane id="cahaya-leleh" width="0.5" height="0.2" position="0 1.25 0.46" color="#FF8A3D"
               material="shader: flat; opacity: 0.4; transparent: true"></a-plane>
      <a-cylinder radius="0.07" height="0.6" position="0.25 1.9 -0.2" color="#5A6166"></a-cylinder>
      <a-text value="LELEHKAN" align="center" color="#0E3B43" width="2.6" font="exo2bold" position="0 2.0 0"></a-text>
    </a-entity>

    <!-- Tempat biji plastik keluar -->
    <a-entity id="biji-plastik" position="1.8 0.95 -2.8"></a-entity>
    <a-text value="BIJI PLASTIK" align="center" color="#0E3B43" width="2.6" font="exo2bold" position="1.9 1.55 -2.8"></a-text>

    <!-- Botol plastik yang diikuti -->
    <a-entity id="botol" position="-3 0.92 -2.8" rotation="0 0 0" scale="2.2 2.2 2.2" botol-plastik></a-entity>

    <!-- Serpihan hasil cacahan (diisi oleh daurulang.js) -->
    <a-entity id="serpihan" position="-0.3 0.94 -2.8" visible="false"></a-entity>

    <!-- Etalase hasil daur ulang (muncul di tahap 4) -->
    <a-entity id="etalase" position="0 0.3 -1.8">
      <a-box width="2.6" height="0.06" depth="0.6" position="0 0.75 0" color="#F3EFE6"></a-box>
      <a-box width="2.5" height="0.72" depth="0.5" position="0 0.36 0" color="#D9D2C3"></a-box>

      <!-- Kaos dari serat polyester (model 3D eksternal: t-shirt.glb) -->
      <a-entity id="produk-kaos" position="-0.95 0.78 0" sorot>
        <a-entity gltf-model="assets/models/t-shirt.glb" model-pas="ukuran: 0.36; sumbu: tinggi"></a-entity>
      </a-entity>
      <a-entity position="-0.95 1.28 0">
        <a-plane width="0.5" height="0.1" color="#FFFFFF" material="shader: flat"></a-plane>
        <a-text value="Kaos" align="center" color="#0E3B43" width="1.2" font="exo2bold" position="0 0 0.005"></a-text>
      </a-entity>

      <!-- Tas belanja (model 3D eksternal: renova_shopping_bag_03.glb) -->
      <a-entity id="produk-tas" position="-0.32 0.78 0" sorot>
        <a-entity gltf-model="assets/models/renova_shopping_bag_03.glb" model-pas="ukuran: 0.36; sumbu: tinggi"></a-entity>
      </a-entity>
      <a-entity position="-0.32 1.28 0">
        <a-plane width="0.5" height="0.1" color="#FFFFFF" material="shader: flat"></a-plane>
        <a-text value="Tas belanja" align="center" color="#0E3B43" width="1.2" font="exo2bold" position="0 0 0.005"></a-text>
      </a-entity>

      <!-- Pot tanaman (model 3D eksternal: flower_in_a_pot.glb) -->
      <a-entity id="produk-pot" position="0.32 0.78 0" sorot>
        <a-entity gltf-model="assets/models/flower_in_a_pot.glb" model-pas="ukuran: 0.42; sumbu: tinggi"></a-entity>
      </a-entity>
      <a-entity position="0.32 1.28 0">
        <a-plane width="0.5" height="0.1" color="#FFFFFF" material="shader: flat"></a-plane>
        <a-text value="Pot tanaman" align="center" color="#0E3B43" width="1.2" font="exo2bold" position="0 0 0.005"></a-text>
      </a-entity>

      <!-- Paving block (model 3D eksternal: paving_stone.glb) -->
      <a-entity id="produk-paving" position="0.95 0.78 0" sorot>
        <a-entity gltf-model="assets/models/paving_stone.glb" model-pas="ukuran: 0.32; sumbu: lebar"></a-entity>
      </a-entity>
      <a-entity position="0.95 1.28 0">
        <a-plane width="0.5" height="0.1" color="#FFFFFF" material="shader: flat"></a-plane>
        <a-text value="Paving block" align="center" color="#0E3B43" width="1.2" font="exo2bold" position="0 0 0.005"></a-text>
      </a-entity>
    </a-entity>

    <!-- Panel dan tombol tahap -->
    <a-entity id="panel" position="0 2.95 -3.4" panel-info="judul: ; isi: ; lebar: 2.6"></a-entity>
    <a-entity id="tombol-tahap" position="0 2.3 -3.2" tombol="teks: Mulai proses; lebar: 1.6"></a-entity>
    <a-entity id="tombol-kuis" position="-0.9 2.3 -3.2" tombol="teks: Uji pemahamanmu; lebar: 1.6"></a-entity>
    <a-entity id="tombol-awal-etalase" position="0.9 2.3 -3.2" tombol="teks: Kembali ke awal; lebar: 1.6; ke: index.html"></a-entity>

    <!-- Kuis -->
    <a-entity id="kuis">
      <a-entity id="jawaban-0" position="0 1.95 -2.1" tombol="teks: A; lebar: 2.1; tinggi: 0.26; hurufPerBaris: 42"></a-entity>
      <a-entity id="jawaban-1" position="0 1.64 -2.1" tombol="teks: B; lebar: 2.1; tinggi: 0.26; hurufPerBaris: 42"></a-entity>
      <a-entity id="jawaban-2" position="0 1.33 -2.1" tombol="teks: C; lebar: 2.1; tinggi: 0.26; hurufPerBaris: 42"></a-entity>
      <a-entity id="tombol-soal-berikut" position="0 1.02 -2.05" tombol="teks: Soal berikutnya; lebar: 1.2; tinggi: 0.24"></a-entity>
    </a-entity>

    <!-- Tombol akhir -->
    <a-entity id="akhir">
      <a-entity id="tombol-ulang-awal" position="-0.75 1.75 -2.1" tombol="teks: Mulai lagi dari awal; lebar: 1.3; tinggi: 0.26; ke: index.html"></a-entity>
      <a-entity id="tombol-jalur-lain" position="0.75 1.75 -2.1" tombol="teks: Lihat jalur selokan; lebar: 1.3; tinggi: 0.26"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
