<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Jejak Plastik VR | TPA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>
  <script src="js/common.js?v=5"></script>
  <script src="js/tpa.js"></script>
</head>
<body>
  <div class="petunjuk">
    <strong>Laptop:</strong> seret layar untuk melihat sekeliling, klik tombol biru.<br>
    <strong>HP:</strong> gerakkan HP, tatap tombol biru 1,5 detik.
  </div>

  <a-scene jp-setup="umur: 3 hari" loading-screen="dotsColor: #1F5FD1; backgroundColor: #E4F2EF">

    <a-assets>
      <!-- Model 3D eksternal: truk (CC BY 4.0, Cesium) -->
      <a-asset-item id="model-truk" src="assets/models/truk.glb"></a-asset-item>
    </a-assets>

    <!-- Lingkungan: kelabu dan berdebu -->
    <a-entity environment="preset: default; seed: 2; skyType: gradient; skyColor: #9AA3A1; horizonColor: #D3CBB7;
                           lighting: none; ground: flat; groundTexture: walkernoise; groundColor: #6E6553; groundColor2: #625A49;
                           dressing: none; grid: none; fog: 0"></a-entity>

    <a-entity light="type: ambient; color: #FFFFFF; intensity: 0.7"></a-entity>
    <a-entity id="matahari" light="type: directional; color: #F1E6CF; intensity: 1" position="3 5 2"></a-entity>

    <a-entity id="kamera" camera look-controls wasd-controls="enabled: false" position="0 1.6 0"></a-entity>

    <!-- Gunungan sampah (diisi oleh tpa.js) -->
    <a-entity id="gunungan"></a-entity>

    <!-- Timbunan sampah di depan (serpihan sampah diisi oleh tpa.js) -->
    <a-entity id="timbunan" position="1.6 0 -4.5">
      <a-sphere id="timbunan-dasar" radius="1.1" scale="1 0.5 1" color="#6F6450"
                segments-width="12" segments-height="8" material="flatShading: true; roughness: 1"></a-sphere>
    </a-entity>

    <!-- Botol plastik di puncak timbunan -->
    <a-entity id="botol" position="1.6 0.56 -4.5" rotation="0 0 70" scale="2.2 2.2 2.2" botol-plastik></a-entity>

    <!-- Alat berat (bulldozer) dari objek primitif, menghadap ke kanan (+x) -->
    <a-entity id="alat-berat" position="-0.6 0 -4.5" visible="false">
      <a-entity id="badan-alat">
        <!-- rantai roda kiri dan kanan -->
        <a-box width="1.6" height="0.32" depth="0.26" position="0 0.16 0.4" color="#232323"></a-box>
        <a-box width="1.6" height="0.32" depth="0.26" position="0 0.16 -0.4" color="#232323"></a-box>
        <a-entity id="roda-alat"></a-entity>
        <!-- badan dan kap mesin -->
        <a-box width="1.3" height="0.42" depth="0.7" position="-0.05 0.53 0" color="#F2B230"></a-box>
        <a-box width="0.6" height="0.24" depth="0.6" position="-0.38 0.86 0" color="#E3A11E"></a-box>
        <!-- kabin -->
        <a-box width="0.55" height="0.6" depth="0.62" position="0.22 1.04 0" color="#F2B230"></a-box>
        <a-plane width="0.42" height="0.3" position="0.5 1.12 0" rotation="0 90 0" color="#26323A"></a-plane>
        <a-plane width="0.4" height="0.3" position="0.22 1.12 0.315" color="#26323A"></a-plane>
        <a-plane width="0.4" height="0.3" position="0.22 1.12 -0.315" rotation="0 180 0" color="#26323A"></a-plane>
        <a-box width="0.68" height="0.05" depth="0.72" position="0.22 1.37 0" color="#D99A1C"></a-box>
        <!-- knalpot -->
        <a-cylinder radius="0.035" height="0.42" position="-0.55 1.15 0.18" color="#333333"></a-cylinder>
        <!-- lengan dan pisau pendorong -->
        <a-box width="0.75" height="0.08" depth="0.08" position="0.78 0.42 0.33" rotation="0 0 -18" color="#D99A1C"></a-box>
        <a-box width="0.75" height="0.08" depth="0.08" position="0.78 0.42 -0.33" rotation="0 0 -18" color="#D99A1C"></a-box>
        <a-box width="0.1" height="0.5" depth="1.25" position="1.12 0.3 0" rotation="0 0 -8" color="#8C8C84"></a-box>
        <a-box width="0.13" height="0.05" depth="1.25" position="1.16 0.06 0" color="#4A4A46"></a-box>
      </a-entity>
    </a-entity>

    <!-- Gundukan tanah yang dituang truk (awalnya tersembunyi) -->
    <a-sphere id="tanah-gundukan" radius="0.55" position="0.2 2.5 -4.5" color="#7A5A3A" visible="false"
              segments-width="9" segments-height="6" material="flatShading: true; roughness: 1"></a-sphere>

    <!-- Lapisan tanah penutup: tumbuh dari kiri ke kanan saat diratakan -->
    <a-entity id="tanah-penutup" position="0.35 0 -4.5" scale="0.01 1 1" visible="false">
      <a-sphere id="lapisan-tanah" radius="1.28" scale="1 0.43 1" position="1.25 0 0" color="#7A5A3A"
                segments-width="16" segments-height="8" material="flatShading: true; roughness: 1"></a-sphere>
    </a-entity>

    <!-- Penghitung tahun -->
    <a-text id="teks-tahun" value="" align="center" color="#F2C230" width="3" font="exo2bold"
            position="1.6 1.4 -4.5"></a-text>

    <!-- Truk pengangkut sampah (model 3D eksternal) -->
    <a-entity id="truk" gltf-model="#model-truk" position="-11 0 -5.8" rotation="0 90 0" scale="0.8 0.8 0.8"></a-entity>

    <!-- Panel dan tombol -->
    <a-entity id="panel" position="-0.4 2.4 -3"
              panel-info="judul: Tempat Pemrosesan Akhir;
                          isi: Di tempat sampah biasa, botolmu tercampur sisa makanan dan sampah lain sehingga sulit dipilah lagi. Truk membawanya ke TPA, tempat sampah dari seluruh kota diproses setiap hari.;
                          lebar: 2.3"></a-entity>
    <a-entity id="tombol-aksi" position="-0.4 1.5 -2.95" tombol="teks: Padatkan sampah; lebar: 1.7"></a-entity>
    <a-entity id="tombol-lanjut" position="-0.4 1.5 -2.95" tombol="teks: Apa yang bisa kita lakukan?; lebar: 1.9; hurufPerBaris: 28"></a-entity>

  </a-scene>
</body>
</html>
