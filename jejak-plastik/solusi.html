<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Jejak Plastik VR | Solusi 3R</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>
  <script src="js/common.js?v=5"></script>
  <script src="js/solusi.js"></script>
</head>
<body>
  <div class="petunjuk">
    <strong>Laptop:</strong> seret layar untuk melihat sekeliling, klik tombol biru.<br>
    <strong>HP:</strong> gerakkan HP, tatap tombol biru 1,5 detik.
  </div>

  <a-scene jp-setup="umur: perjalanannya bisa dihentikan" loading-screen="dotsColor: #1F5FD1; backgroundColor: #E4F2EF">

    <a-assets>
      <!-- Model 3D eksternal: botol minum isi ulang (CC0, KhronosGroup glTF Sample Assets) -->
      <a-asset-item id="model-botol-isi-ulang" src="assets/models/botol-isi-ulang.glb"></a-asset-item>
    </a-assets>

    <!-- Lingkungan paling cerah: tanda harapan -->
    <a-entity environment="preset: default; seed: 7; skyType: gradient; skyColor: #7CCBF2; horizonColor: #F2FBF4;
                           lighting: none; ground: flat; groundTexture: walkernoise; groundColor: #8CC56E; groundColor2: #7FBB61;
                           dressing: trees; dressingAmount: 16; dressingColor: #3F9A52; grid: none; fog: 0"></a-entity>

    <a-entity light="type: ambient; color: #FFFFFF; intensity: 0.85"></a-entity>
    <a-entity light="type: directional; color: #FFF8E6; intensity: 1.2" position="-2 5 3"></a-entity>

    <a-entity id="kamera" camera look-controls wasd-controls="enabled: false" position="0 1.6 0"></a-entity>

    <!-- Gedung bank sampah di latar belakang -->
    <a-entity id="gedung" position="0 0 -8">
      <a-box width="7" height="3" depth="3" position="0 1.5 0" color="#F2C230"></a-box>
      <a-box width="7.6" height="0.25" depth="3.6" position="0 3.1 0" color="#2E9E5B"></a-box>
      <a-box width="2.2" height="2.2" depth="0.1" position="0 1.1 1.52" color="#5B4630"></a-box>
      <a-plane width="3.4" height="0.6" position="0 2.55 1.53" color="#FFFFFF"></a-plane>
      <a-text value="BANK SAMPAH" align="center" color="#0E3B43" width="5" font="exo2bold" position="0 2.55 1.54"></a-text>
    </a-entity>

    <!-- Tiga pos 3R -->
    <a-entity id="pos-3r">
      <!-- Kurangi: botol minum isi ulang (model eksternal) -->
      <a-entity id="pos-kurangi" position="-1.7 0 -2.8">
        <a-cylinder radius="0.35" height="0.7" position="0 0.35 0" color="#FFFFFF"></a-cylinder>
        <a-entity id="obj-kurangi" gltf-model="#model-botol-isi-ulang" position="0 1.1 0" scale="3 3 3" sorot
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear"></a-entity>
      </a-entity>
      <a-entity id="tombol-kurangi" position="-1.7 1.8 -2.75" tombol="teks: Kurangi; lebar: 1.2"></a-entity>

      <!-- Gunakan ulang: pot tanaman dari botol bekas -->
      <a-entity id="pos-ulang" position="0 0 -2.8">
        <a-cylinder radius="0.35" height="0.7" position="0 0.35 0" color="#FFFFFF"></a-cylinder>
        <a-entity id="obj-ulang" position="0 0.7 0" sorot>
          <a-cylinder radius="0.11" height="0.22" position="0 0.11 0" color="#CFEFFF"
                      material="opacity: 0.55; transparent: true"></a-cylinder>
          <a-cylinder radius="0.105" height="0.12" position="0 0.07 0" color="#6B4A2E"></a-cylinder>
          <a-cone radius-bottom="0.05" radius-top="0" height="0.35" position="0 0.33 0" color="#3F9A52"></a-cone>
          <a-cone radius-bottom="0.04" radius-top="0" height="0.28" position="0.06 0.28 0.02" rotation="0 0 -25" color="#4FB062"></a-cone>
          <a-cone radius-bottom="0.04" radius-top="0" height="0.28" position="-0.06 0.28 -0.02" rotation="0 0 25" color="#4FB062"></a-cone>
        </a-entity>
      </a-entity>
      <a-entity id="tombol-ulang" position="0 1.8 -2.75" tombol="teks: Gunakan ulang; lebar: 1.2"></a-entity>

      <!-- Daur ulang: biji plastik hasil cacahan (diisi oleh daurulang.js) -->
      <a-entity id="pos-daur" position="1.7 0 -2.8">
        <a-cylinder radius="0.35" height="0.7" position="0 0.35 0" color="#FFFFFF"></a-cylinder>
        <a-entity id="obj-daur" position="0 0.72 0" sorot></a-entity>
      </a-entity>
      <a-entity id="tombol-daur" position="1.7 1.8 -2.75" tombol="teks: Daur ulang; lebar: 1.2"></a-entity>

      <a-entity id="tombol-kuis" position="0 1.3 -2.6" tombol="teks: Uji pemahamanmu; lebar: 1.6"></a-entity>
      <a-entity id="tombol-ke-pabrik" position="0 1.3 -2.6" tombol="teks: Ikuti botol ke tempat daur ulang; lebar: 2.1; hurufPerBaris: 30"></a-entity>
    </a-entity>

    <!-- Kuis (dibangun oleh daurulang.js) -->
    <a-entity id="kuis">
      <a-entity id="jawaban-0" position="0 2.0 -2.9" tombol="teks: A; lebar: 2.6; hurufPerBaris: 36"></a-entity>
      <a-entity id="jawaban-1" position="0 1.63 -2.9" tombol="teks: B; lebar: 2.6; hurufPerBaris: 36"></a-entity>
      <a-entity id="jawaban-2" position="0 1.26 -2.9" tombol="teks: C; lebar: 2.6; hurufPerBaris: 36"></a-entity>
      <a-entity id="tombol-soal-berikut" position="0 0.88 -2.8" tombol="teks: Soal berikutnya; lebar: 1.5"></a-entity>
    </a-entity>

    <!-- Tombol akhir -->
    <a-entity id="akhir">
      <a-entity id="tombol-ulang-awal" position="-0.9 1.45 -2.9" tombol="teks: Mulai lagi dari awal; lebar: 1.6; ke: index.html"></a-entity>
      <a-entity id="tombol-jalur-lain" position="0.9 1.45 -2.9" tombol="teks: Lihat jalur bank sampah; lebar: 1.6"></a-entity>
    </a-entity>

    <!-- Panel utama -->
    <a-entity id="panel" position="0 2.9 -3.3"
              panel-info="judul: ; isi: ; lebar: 2.6"></a-entity>

  </a-scene>
</body>
</html>
